<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- hintere Karte -->
  <g transform="rotate(-9 512 520)" filter="url(#shadow)">
    <rect x="222" y="292" width="600" height="390" rx="34" fill="#4a4a50"/>
  </g>
  <!-- vordere Karteikarte -->
  <g filter="url(#shadow)">
    <rect x="182" y="356" width="640" height="420" rx="34" fill="#f4f2ec"/>
  </g>
  <line x1="182" y1="452" x2="822" y2="452" stroke="#ff453a" stroke-width="9"/>
  <g stroke="#7cb7e8" stroke-width="5" opacity="0.75">
    <line x1="182" y1="524" x2="822" y2="524"/>
    <line x1="182" y1="590" x2="822" y2="590"/>
    <line x1="182" y1="656" x2="822" y2="656"/>
    <line x1="182" y1="722" x2="822" y2="722"/>
  </g>
  <!-- Haken: "kann ich" -->
  <circle cx="790" cy="752" r="112" fill="#30d158" filter="url(#shadow)"/>
  <path d="M736 754l38 38 72-80" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
